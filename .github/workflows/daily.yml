name: Tägliches Update

on:
  schedule:
    - cron: "17 11 * * *"     # täglich 12:17 Uhr deutscher Winterzeit (13:17 Sommerzeit)
  workflow_dispatch: {}        # manuell starten: Reiter „Actions“ → „Tägliches Update“ → „Run workflow“

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline-Selbsttest
        run: python -m pipeline.selftest
      - name: Daten holen und Modelle rechnen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run
      - name: Ergebnisse speichern
        run: |
          git config user.name "quoten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Daten-Update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
